<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>CAD to EUR Ontario</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      max-width: 420px;
      margin: 0 auto;
      padding: 32px 20px;
      color: #111;
      background: #fff;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 24px;
    }
    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 16px;
      font-size: 24px;
      border: 1px solid #bbb;
      border-radius: 10px;
      appearance: none;
    }
    input:focus {
      outline: 2px solid #111;
      outline-offset: 1px;
    }
    #result {
      margin-top: 24px;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 23px;
      line-height: 1.7;
      font-weight: 700;
      min-height: 94px;
    }
    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>CAD to EUR</h1>

  <label for="price">Price in CAD</label>
  <input
    id="price"
    type="number"
    min="0"
    step="0.01"
    inputmode="decimal"
    placeholder="79.99"
    autofocus
  >

  <div id="result">
    Without tax: €0.00<br>
    With tax: €0.00
  </div>

  <div class="note">Ontario tax: 13% · CAD to EUR: 0.62</div>

  <script>
    const TAX_RATE = 0.13;
    const EXCHANGE_RATE = 0.62;

    const priceInput = document.getElementById('price');
    const result = document.getElementById('result');

    function convertPrice() {
      const value = priceInput.value.trim();

      if (value === '') {
        result.innerHTML = 'Without tax: €0.00<br>With tax: €0.00';
        return;
      }

      const priceCAD = parseFloat(value);

      if (!Number.isFinite(priceCAD) || priceCAD < 0) {
        result.innerHTML = 'Without tax: €0.00<br>With tax: €0.00';
        return;
      }

      const withoutTaxEUR = priceCAD * EXCHANGE_RATE;
      const withTaxEUR = priceCAD * (1 + TAX_RATE) * EXCHANGE_RATE;

      result.innerHTML =
        'Without tax: €' + withoutTaxEUR.toFixed(2) +
        '<br>With tax: €' + withTaxEUR.toFixed(2);
    }

    priceInput.addEventListener('input', convertPrice);
    priceInput.addEventListener('change', convertPrice);
    convertPrice();
  </script>
</body>
</html>
